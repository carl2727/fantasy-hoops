name: Daily Rating Pipeline

on:
  schedule:
    # 6:00 UTC taeglich (7:00 CET / 8:00 CEST) -- gleicher Zeitpunkt wie in v1
    - cron: "0 6 * * *"
  workflow_dispatch: {}  # manuell ausloesbar, z. B. fuer den ersten Testlauf

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r pipeline/requirements.txt

      - name: Run pipeline
        run: python -m pipeline.main
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
